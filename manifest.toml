# Name of the speller package in various languages.
# The default is English + autonym:
[speller.name]
en = "Ume Sami spellchecker"
sju = "Autonym spellchecker"

# Description of the speller package in various languages.
# The default is English + autonym:
[speller.description]
en = "A spellchecker for Ume Sami, made by members of the language community, and by the Divvun and Giellatekno groups at UiT The Arctic University of Norway"
sju = "TRANSLATE: A spellchecker for Ume Sami, made by members of the language community, and by the Divvun and Giellatekno groups at UiT The Arctic University of Norway"

[macos]
system_pkg_id = "no.divvun.MacDivvun.sju"

[windows]
system_product_code = "{REPLACE_WITH_REAL_SYSTEM_PROD_CODE}_is1"

[package.speller]
name = "Ume Sami"
version = "0.1.0"

[package.grammar]
name = "Ume Sami"
version = "0.1.0"

[package.tts-textproc]
name = "Ume Sami"
version = "0.1.0"

[package.hyphenator]
name = "Ume Sami"
version = "0.1.0"
